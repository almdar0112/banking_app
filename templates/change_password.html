{% extends "base.html" %}

{% block title %}مراد بنك - تغيير كلمة المرور{% endblock %}

{% block content %}
<div class="murad bank-login">

    <!-- HEADER -->
    <header class="login-header">
        <button class="back-btn" onclick="history.back()">
            <i class="fas fa-arrow-right"></i>
        </button>
        <div class="header-logo">
            <span class="logo-ar">إعدادات الأمان</span>
        </div>
        <div style="width: 40px;"></div>
    </header>

    <div class="login-logo-section">
        <div class="bank-icon" style="background: linear-gradient(145deg, #424242, #616161);">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h1 class="welcome-title">تغيير كلمة المرور</h1>
        <p class="welcome-sub">حافظ على أمان حسابك</p>
    </div>

    <div class="login-form-container">
        <form method="POST" action="/change-password">
            
            <!-- كلمة المرور القديمة -->
            <div class="input-group-modern">
                <label class="input-label">كلمة المرور الحالية</label>
                <div class="input-wrapper">
                    <i class="fas fa-key input-icon"></i>
                    <input type="password" name="old_password" class="modern-input" 
                           placeholder="أدخل كلمة المرور الحالية" required>
                </div>
            </div>

            <!-- كلمة المرور الجديدة -->
            <div class="input-group-modern">
                <label class="input-label">كلمة المرور الجديدة</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" name="new_password" class="modern-input" 
                           placeholder="6 أحرف على الأقل" minlength="6" required>
                </div>
            </div>

            <!-- تأكيد -->
            <div class="input-group-modern">
                <label class="input-label">تأكيد كلمة المرور الجديدة</label>
                <div class="input-wrapper">
                    <i class="fas fa-check-circle input-icon"></i>
                    <input type="password" name="confirm_password" class="modern-input" 
                           placeholder="أعد كتابة كلمة المرور" minlength="6" required>
                </div>
            </div>

            <!-- زر الحفظ -->
            <button type="submit" class="login-btn-modern" style="background: #424242;">
                <span>حفظ التغييرات</span>
                <i class="fas fa-save"></i>
            </button>

        </form>
    </div>

</div>
{% endblock %}
