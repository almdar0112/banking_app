{% extends "base.html" %}

{% block title %}مراد بنك - إيداع{% endblock %}

{% block content %}
<div class="murad bank-login">

    <!-- HEADER -->
    <header class="login-header">
        <button class="back-btn" onclick="history.back()">
            <i class="fas fa-arrow-right"></i>
        </button>
        <div class="header-logo">
            <span class="logo-ar">إيداع</span>
        </div>
        <div style="width: 40px;"></div>
    </header>

    <div class="login-logo-section">
        <div class="bank-icon" style="background: linear-gradient(145deg, #00c853, #00e676);">
            <i class="fas fa-plus-circle"></i>
        </div>
        <h1 class="welcome-title">إيداع أموال</h1>
        <p class="welcome-sub">أضف رصيداً إلى حسابك</p>
    </div>

    <div class="login-form-container">
        <form method="POST" action="/deposit">
            
            <!-- المبلغ -->
            <div class="input-group-modern">
                <label class="input-label">المبلغ (ج.م)</label>
                <div class="input-wrapper">
                    <i class="fas fa-money-bill-wave input-icon"></i>
                    <input type="number" name="amount" class="modern-input" 
                           placeholder="أدخل المبلغ" step="0.01" min="0.01" required>
                </div>
            </div>

            <!-- مبالغ سريعة -->
            <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px;">
                <button type="button" onclick="setAmount(100)" class="quick-btn">100 ج.م</button>
                <button type="button" onclick="setAmount(500)" class="quick-btn">500 ج.م</button>
                <button type="button" onclick="setAmount(1000)" class="quick-btn">1000 ج.م</button>
                <button type="button" onclick="setAmount(5000)" class="quick-btn">5000 ج.م</button>
            </div>

            <!-- زر التأكيد -->
            <button type="submit" class="login-btn-modern" style="background: #00c853;">
                <span>تأكيد الإيداع</span>
                <i class="fas fa-check"></i>
            </button>

        </form>
    </div>

</div>

<style>
    .back-btn {
        width: 40px;
        height: 40px;
        border: none;
        background: rgba(255,255,255,0.2);
        border-radius: 50%;
        color: white;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .quick-btn {
        padding: 8px 16px;
        border: 1px solid #e0e0e0;
        border-radius: 20px;
        background: white;
        color: #d50000;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s;
    }
    
    .quick-btn:active {
        background: #d50000;
        color: white;
    }
</style>

<script>
    function setAmount(amount) {
        document.querySelector('input[name="amount"]').value = amount;
    }
</script>

{% endblock %}
