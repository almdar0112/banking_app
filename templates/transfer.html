{% extends "base.html" %}

{% block title %}مراد بنك - تحويل{% endblock %}

{% block content %}
<div class="murad bank-login">

    <!-- HEADER -->
    <header class="login-header">
        <button class="back-btn" onclick="history.back()">
            <i class="fas fa-arrow-right"></i>
        </button>
        <div class="header-logo">
            <span class="logo-ar">تحويل أموال</span>
        </div>
        <div style="width: 40px;"></div>
    </header>

    <div class="login-logo-section">
        <div class="bank-icon" style="background: linear-gradient(145deg, #ff6d00, #ff9100);">
            <i class="fas fa-paper-plane"></i>
        </div>
        <h1 class="welcome-title">تحويل أموال</h1>
        <p class="welcome-sub">حول الأموال لحساب آخر</p>
    </div>

    <div class="login-form-container">
        <form method="POST" action="/transfer">
            
            <!-- رقم حساب المستلم -->
            <div class="input-group-modern">
                <label class="input-label">رقم حساب المستلم</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" name="receiver" class="modern-input" 
                           placeholder="أدخل رقم الحساب (7 أرقام)" 
                           pattern="[0-9]{7}" maxlength="7" required>
                </div>
            </div>

            <!-- المبلغ -->
            <div class="input-group-modern">
                <label class="input-label">المبلغ (ج.م)</label>
                <div class="input-wrapper">
                    <i class="fas fa-money-bill-wave input-icon"></i>
                    <input type="number" name="amount" class="modern-input" 
                           placeholder="أدخل المبلغ" step="0.01" min="0.01" required>
                </div>
            </div>

            <!-- زر التحويل -->
            <button type="submit" class="login-btn-modern" style="background: #ff6d00;">
                <span>تأكيد التحويل</span>
                <i class="fas fa-paper-plane"></i>
            </button>

        </form>
    </div>

</div>
{% endblock %}
